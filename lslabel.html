/* Wrapper */
.wrapper {
    min-height: 100vh;
    padding: 40px 20px;
}
/* Hlavní nadpis */
.main-title {
    text-align: center;
    font-size: clamp(2rem, 6vw, 3.5rem);
    margin: 0 0 50px;
    color: #fff;
}
.highlight {
    color: #FFB84D;
}
/* Kontejner pro akce */
.events-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 40px;
}
/* Karta události */
.event-card {
    background: rgba(0,0,0,0.50);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    padding: 30px;
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 30px;
    align-items: start;
}
/* Plakát */
.poster {
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
/* Info sekce */
.event-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.event-title {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    color: #FFB84D;
    margin: 0 0 20px;
    font-weight: bold;
}
.event-details {
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: #eee;
    line-height: 1.7;
    margin: 0 0 25px;
}
/* Odpočet */
.countdown {
    background: rgba(255, 184, 77, 0.15);
    border-left: 4px solid #FFB84D;
    border-radius: 8px;
    padding: 20px;
    margin: 20px 0;
}
.countdown-title {
    font-size: 1.1rem;
    color: #FFB84D;
    margin: 0 0 10px;
    font-weight: bold;
}
.countdown-timer {
    font-size: clamp(1.3rem, 4vw, 2rem);
    color: #fff;
    font-weight: bold;
    font-family: 'Courier New', monospace;
}
/* Připravovaná akce */
.upcoming {
    text-align: center;
    padding: 40px 30px;
}
.upcoming-title {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    color: #FFB84D;
    margin: 0 0 15px;
    font-weight: bold;
}
.upcoming-status {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    color: #eee;
    font-style: italic;
}
/* Tlačítka */
.buttons-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 40px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}
.btn {
    display: inline-block;
    padding: 14px 28px;
    font-size: 1.05rem;
    font-weight: bold;
    color: #000;
    background: linear-gradient(135deg, #FFB84D 0%, #FF8C42 100%);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-align: center;
}
.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 184, 77, 0.5);
}
.btn:active {
    transform: translateY(0);
    box-shadow: none;
}
/* Mobilní */
@media (max-width: 900px) {
    .event-card {
        grid-template-columns: 1fr;
        text-align: center;
    }
    .poster {
        max-width: 400px;
        margin: 0 auto;
    }
    .countdown {
        text-align: center;
    }
}
@media (max-width: 600px) {
    .buttons-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<script>
// Odpočet do akce
function updateCountdown() {
    const eventDate = new Date('2026-03-07T16:00:00');
    const now = new Date();
    const diff = eventDate - now;
    
    const countdownElement = document.getElementById('countdown');
    
    if (diff <= 0) {
        countdownElement.textContent = '🎉 Akce proběhla';
        countdownElement.style.color = '#FFB84D';
        return;
    }
    
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    
    countdownElement.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

// Update každou sekundu
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
<script>

}
document.addEventListener('click', function() {
    document.getElementById('contactMenu').style.display = 'none';
});
